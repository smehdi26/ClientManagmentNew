<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Client - CTI Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 16px -8px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        .btn-primary:hover {
            background-color: #4338ca;
            border-color: #4338ca;
        }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
                    <div class="bg-primary text-white p-2 rounded d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                        <i class="bi bi-person-fill-add fs-4"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">Client Registration</h4>
                        <p class="text-muted mb-0 small">Create a new client and configure communication lines</p>
                    </div>
                </div>

                <form th:action="@{/clients/add}" th:object="${client}" method="post">
                    <!-- Client Name -->
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-medium">Client Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" th:field="*{name}" class="form-control bg-light border-start-0 ps-0" placeholder="Jane Doe" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                        </div>
                        <div class="text-danger small mt-1" th:errors="*{name}"></div>
                    </div>

                    <!-- Email Address -->
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-medium">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" th:field="*{email}" class="form-control bg-light border-start-0 ps-0" placeholder="jane@example.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                        </div>
                        <div class="text-danger small mt-1" th:errors="*{email}"></div>
                    </div>

                    <!-- Description -->
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-medium">Description / Notes</label>
                        <textarea th:field="*{description}" class="form-control bg-light" rows="3" placeholder="Key service details, preferences, or location..."></textarea>
                    </div>

                    <!-- Phone List Segment -->
                    <div class="mb-4 p-3 bg-light rounded-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <label class="form-label mb-0 text-muted fw-bold small"><i class="bi bi-phone-fill me-1 text-primary"></i> Registered Phone Lines</label>
                            <button type="button" id="add-phone-btn" class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1">
                                <i class="bi bi-plus"></i> Add Number
                            </button>
                        </div>

                        <div id="phone-container">
                            <div class="input-group mb-2 phone-input-group" th:each="phone, stat : *{phones}">
                                <input type="text" th:field="*{phones[__${stat.index}__]}" class="form-control" placeholder="8-digit Tunisian phone number" required>
                                <button type="button" class="btn btn-danger remove-phone-btn">Delete</button>
                            </div>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phones')}" th:errors="*{phones}"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1 py-2 rounded-3">Save Registration</button>
                        <a th:href="@{/dashboard}" class="btn btn-light border py-2 rounded-3 px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('add-phone-btn').addEventListener('click', function() {
        const container = document.getElementById('phone-container');
        const index = container.getElementsByClassName('phone-input-group').length;

        const div = document.createElement('div');
        div.className = 'input-group mb-2 phone-input-group';
        div.innerHTML = `
            <input type="text" name="phones[${index}]" class="form-control" placeholder="8-digit Tunisian phone number" required />
            <button type="button" class="btn btn-danger remove-phone-btn">Delete</button>
        `;
        container.appendChild(div);
    });

    document.getElementById('phone-container').addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-phone-btn')) {
            const container = document.getElementById('phone-container');
            if (container.getElementsByClassName('phone-input-group').length > 1) {
                e.target.closest('.phone-input-group').remove();
                const groups = container.getElementsByClassName('phone-input-group');
                for (let i = 0; i < groups.length; i++) {
                    groups[i].querySelector('input').name = `phones[${i}]`;
                }
            } else {
                alert("At least one registered contact number is required.");
            }
        }
    });
</script>
</body>
</html>
