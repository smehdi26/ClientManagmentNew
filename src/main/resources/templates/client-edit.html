<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Client</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h3>Edit Client Detail</h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/clients/{existingPhone}/edit(existingPhone=${existingPhone})}" th:object="${client}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">Client Name</label>
                            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-flex justify-content-between align-items-center">
                                <span>Phone Numbers (Tunisian, 8-digits)</span>
                                <button type="button" id="add-phone-btn" class="btn btn-sm btn-success">+ Add Number</button>
                            </label>

                            <div id="phone-container">
                                <div class="input-group mb-2 phone-input-group" th:each="phone, stat : *{phones}">
                                    <input type="text" th:field="*{phones[__${stat.index}__]}" class="form-control" placeholder="e.g. 98765432" required>
                                    <button type="button" class="btn btn-danger remove-phone-btn">Delete</button>
                                </div>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phones')}" th:errors="*{phones}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning flex-grow-1">Update Client</button>
                            <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('add-phone-btn').addEventListener('click', function() {
        const container = document.getElementById('phone-container');
        const index = container.getElementsByClassName('phone-input-group').length;

        const div = document.createElement('div');
        div.className = 'input-group mb-2 phone-input-group';
        div.innerHTML = `
            <input type="text" name="phones[${index}]" class="form-control" placeholder="e.g. 98765432" required />
            <button type="button" class="btn btn-danger remove-phone-btn">Delete</button>
        `;
        container.appendChild(div);
    });

    document.getElementById('phone-container').addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-phone-btn')) {
            const container = document.getElementById('phone-container');
            if (container.getElementsByClassName('phone-input-group').length > 1) {
                e.target.closest('.phone-input-group').remove();
                const groups = container.getElementsByClassName('phone-input-group');
                for (let i = 0; i < groups.length; i++) {
                    groups[i].querySelector('input').name = `phones[${i}]`;
                }
            } else {
                alert("At least one phone number is required!");
            }
        }
    });
</script>
</body>
</html>
