<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center - CTI Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-light: #f8fafc;
            --sidebar-width: 260px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
        }
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0f172a;
            z-index: 100;
        }
        .sidebar .nav-link {
            color: #94a3b8;
            padding: 12px 24px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 8px;
            margin: 4px 16px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            padding: 2rem;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .notif-item {
            border-left: 4px solid #94a3b8;
        }
        .notif-SUCCESS { border-left-color: #10b981; }
        .notif-DANGER { border-left-color: #ef4444; }
        .notif-INFO { border-left-color: #3b82f6; }
    </style>
</head>
<body>

<!-- Sidebar Menu -->
<aside class="sidebar d-flex flex-column">
    <div class="px-4 py-4 d-flex align-items-center gap-3">
        <div class="bg-primary p-2 rounded text-white d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
            <i class="bi bi-shield-lock-fill fs-5"></i>
        </div>
        <div>
            <h6 class="text-white mb-0 fw-bold">CTI Network</h6>
            <small class="text-muted text-uppercase fw-semibold" style="font-size: 10px;">Workspace</small>
        </div>
    </div>

    <nav class="nav flex-column mt-3 flex-grow-1">
        <a class="nav-link" th:href="@{/dashboard}">
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a class="nav-link" th:href="@{/reservations}">
            <i class="bi bi-calendar-event-fill"></i> Reservations
        </a>
        <a class="nav-link active" th:href="@{/notifications}">
            <i class="bi bi-bell-fill"></i> Notifications
            <span th:if="${unreadNotificationsCount > 0}" class="badge bg-danger ms-auto rounded-pill" th:text="${unreadNotificationsCount}">0</span>
        </a>
    </nav>

    <div class="p-3 border-top border-secondary">
        <form th:action="@{/logout}" method="post" class="w-100 px-3">
            <button type="submit" class="btn btn-outline-danger btn-sm w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-box-arrow-right"></i> Sign Out
            </button>
        </form>
    </div>
</aside>

<!-- Main Workspace -->
<main class="main-content">
    <div class="container-fluid">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2">
            <div>
                <h3 class="fw-bold text-dark mb-1">Notification Center</h3>
                <p class="text-muted mb-0">System events log history</p>
            </div>

            <form th:action="@{/notifications/read-all}" method="post" th:if="${unreadNotificationsCount > 0}">
                <button type="submit" class="btn btn-outline-primary d-flex align-items-center gap-2 px-3 py-2">
                    <i class="bi bi-check-all"></i> Mark All as Read
                </button>
            </form>
        </div>

        <!-- Notifications History List -->
        <div class="d-flex flex-column gap-3">
            <div th:each="notif : ${notifications}"
                 class="card p-4 notif-item"
                 th:classappend="'notif-' + ${notif.type}"
                 th:style="${notif.readStatus} ? 'opacity: 0.75;' : ''">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="d-flex align-items-center gap-3">
                        <!-- Icon representation -->
                        <div class="p-2 rounded-circle"
                             th:classappend="${
                                notif.type == 'SUCCESS' ? 'bg-success-subtle text-success' : (
                                notif.type == 'DANGER' ? 'bg-danger-subtle text-danger' : 'bg-primary-subtle text-primary'
                             )}">
                            <i class="bi" th:classappend="${
                                notif.type == 'SUCCESS' ? 'bi-check-circle-fill' : (
                                notif.type == 'DANGER' ? 'bi-x-circle-fill' : 'bi-info-circle-fill'
                            )}"></i>
                        </div>
                        <div>
                            <p class="mb-0 fw-medium text-dark" th:text="${notif.message}">System Log Message</p>
                            <small class="text-muted" th:text="${#temporals.format(notif.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
                        </div>
                    </div>
                    <span th:if="${!notif.readStatus}" class="badge bg-danger rounded-pill">New</span>
                </div>
            </div>

            <!-- Empty Log State -->
            <div th:if="${#lists.isEmpty(notifications)}" class="card p-5 text-center text-muted">
                <i class="bi bi-bell-slash fs-1 d-block mb-3 text-muted"></i>
                No notifications logged yet.
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
